<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- SEO: page description shown in search engine results -->
	<meta name="description" content="Filter and manage movies. Add movies to your borrowing cart.">

	<meta name="keywords" content="movies, filtering, cart, cinema, reviews">

	<link rel="stylesheet" href="styles/style.css">
	<link rel="stylesheet" href="styles/movies.css">
	<link rel="stylesheet" href="styles/movies.css">
	<title>Movie Database - Browse & Add to Cart</title>
</head>

<body>

	<!-- ==================== HEADER ==================== -->
	<header>
		<h1 class="header-title">Movie Database</h1>
	</header>

	<!-- ==================== NAVIGATION ==================== -->
	<nav aria-label="Primary navigation">
		<ul class="nav-menu">
			<li><a href="index.html" class="active">Home</a></li>
			<li><a href="cart.html">My Cart <span id="cart-badge" class="cart-badge" style="display: none;">0</span></a></li>
			<li><a href="pages/graphs.html">Graphs</a></li>
			<li><a href="pages/images.html">Images</a></li>
			<li><a href="gallery">Gallery</a></li>
		</ul>
	</nav>

	<!-- ==================== MAIN ==================== -->
	<main>

		<!-- Section - Filters -->
		<section class="content-section" aria-labelledby="filters-title">
			<h2 id="filters-title">Filter Movies</h2>
			
			<div class="filters-container">
				<!-- Genre Filter -->
				<div class="filter-group">
					<label for="genre-filter">Genre:</label>
					<select id="genre-filter">
						<option value="">All Genres</option>
					</select>
				</div>

				<!-- Year Range Filter -->
				<div class="filter-group">
					<label for="year-from">Year From:</label>
					<input type="number" id="year-from" placeholder="e.g., 1990" min="1900" max="2026">
				</div>

				<div class="filter-group">
					<label for="year-to">Year To:</label>
					<input type="number" id="year-to" placeholder="e.g., 2020" min="1900" max="2026">
				</div>

				<!-- Country Filter -->
				<div class="filter-group">
					<label for="country-filter">Country:</label>
					<select id="country-filter">
						<option value="">All Countries</option>
					</select>
				</div>

				<!-- Rating Range Filter -->
				<div class="filter-group">
					<label for="rating-from">Rating From:</label>
					<input type="number" id="rating-from" placeholder="e.g., 7.0" min="0" max="10" step="0.1">
				</div>

				<div class="filter-group">
					<label for="rating-to">Rating To:</label>
					<input type="number" id="rating-to" placeholder="e.g., 10.0" min="0" max="10" step="0.1">
				</div>

				<!-- Sorting -->
				<div class="filter-group">
					<label for="sort-by">Sort By:</label>
					<select id="sort-by">
						<option value="">None</option>
						<option value="year-asc">Year (Ascending)</option>
						<option value="year-desc">Year (Descending)</option>
						<option value="rating-asc">Rating (Ascending)</option>
						<option value="rating-desc">Rating (Descending)</option>
						<option value="title-asc">Title (A-Z)</option>
					</select>
				</div>

				<!-- Action Buttons -->
				<div class="filter-group">
					<button id="apply-filters-btn" class="btn-primary">Apply Filters</button>
					<button id="reset-filters-btn" class="btn-secondary">Reset</button>
				</div>
			</div>

			<div id="results-count" class="results-count"></div>
		</section>

		<!-- Section - Movie Table -->
		<section class="content-section" aria-labelledby="movies-title">
			<h2 id="movies-title">Movies</h2>

			<div class="table-wrapper">
				<table id="movies-table">
					<thead>
						<tr>
							<th>Title</th>
							<th>Year</th>
							<th>Genre</th>
							<th>Duration (min)</th>
							<th>Country</th>
							<th>Rating</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody id="movies-tbody">
						<tr>
							<td colspan="7" class="loading">Loading movies...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>

	</main>

	<!-- ==================== FOOTER ==================== -->
	<footer>
		<p>&copy; 2026 Movie Database. All rights reserved.</p>
	</footer>

	<!-- PapaParse Library for CSV parsing -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
	
	<!-- Main JavaScript File -->
	<script src="js/movies.js"></script>

</body>

</html>
</html>
